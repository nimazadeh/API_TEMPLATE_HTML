<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>بازیابی گذرواژه — APIForge X</title>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('afx-theme'); } catch (e) {}
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <main class="auth">
      <div class="auth__card">
        <div class="auth__brand">
          <span class="brand-mark"><i data-lucide="zap"></i></span>
          <span class="brand-name">APIForge X</span>
        </div>

        <h1 class="auth__title">بازیابی گذرواژه</h1>
        <p class="auth__subtitle">ایمیل خود را وارد کنید؛ پیوند بازنشانی را برایتان می‌فرستیم.</p>

        <form id="forgot-form" novalidate>
          <div class="form-group mb-4">
            <label class="form-label" for="forgot-email">ایمیل</label>
            <input class="form-control form-control--mono" id="forgot-email" type="email" dir="ltr" autocomplete="email" placeholder="you@company.com" />
            <div class="invalid-feedback">یک ایمیل معتبر وارد کنید.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="forgot-submit"><i data-lucide="send"></i> ارسال پیوند</button>
        </form>

        <div class="auth__notice" id="forgot-sent" role="status" hidden>
          <i data-lucide="circle-check"></i>
          <div>اگر این ایمیل ثبت شده باشد، پیوند بازنشانی برایتان ارسال می‌شود. (نسخهٔ نمایشی — ایمیلی واقعاً ارسال نمی‌شود.)</div>
        </div>

        <div class="auth__footer">
          <a href="./login.html">بازگشت به ورود</a>
        </div>
      </div>
    </main>

    <script type="module" src="/src/js/pages/forgot-password.js"></script>
  </body>
</html>
